blueprint: block
name: Formations
icon: globe
preview: fields
wysiwyg: true

fields:
  title:
    type: writer
    label: Titre
    inline: true
    width: 1/2
    nodes:
      - paragraph
    marks:
      - italic
    help: Titre de la section

  formation_professionnelle:
    type: object
    label: Carte — Formation Professionnelle
    help: Contenu affiché sous l'image de la carte "Formation Professionnelle" (l'image vient de la page elle-même)
    fields:
      tag:
        type: text
        label: Petit texte (au-dessus du titre)
      title:
        type: text
        label: Titre
      description:
        type: writer
        label: Description
        inline: false
        nodes:
          - paragraph
        marks:
          - italic

  pratique_amateur:
    type: object
    label: Carte — Pratique Amateur
    help: Contenu affiché sous l'image de la carte "Pratique Amateur" (l'image vient de la page elle-même)
    fields:
      tag:
        type: text
        label: Petit texte (au-dessus du titre)
      title:
        type: text
        label: Titre
      description:
        type: writer
        label: Description
        inline: false
        nodes:
          - paragraph
        marks:
          - italic

  help:
    type: info
    text: Seule l'image de chaque carte vient de la page "Formation Professionnelle" / "Pratique Amateur" elle-même — tout le reste (petit texte, titre, description) est éditable ci-dessus.
